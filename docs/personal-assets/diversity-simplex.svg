<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 170" width="258" height="170">
  <title>Inverse Simpson diversity across three-taxon compositions</title>
  <desc>Each vertex represents a community containing only A, B, or C. Bands mark increments of 0.25 in effective diversity, reaching three at the center.</desc>
  <defs>
    <path id="simplex" d="M129 15 208.67 153H49.33Z" />
    <clipPath id="bounds"><use href="#simplex" /></clipPath>
  </defs>
  <use href="#simplex" fill="#27645e" />
  <!-- For circumradius R and radial distance r, inverse Simpson diversity is 3 / (1 + 2(r/R)^2). -->
  <g clip-path="url(#bounds)" stroke="#204d48" stroke-opacity=".42" stroke-width=".65">
    <circle cx="129" cy="107" r="76.97" fill="#34776e" />
    <circle cx="129" cy="107" r="65.05" fill="#499380" />
    <circle cx="129" cy="107" r="54.98" fill="#66a68c" />
    <circle cx="129" cy="107" r="46.00" fill="#85b899" />
    <circle cx="129" cy="107" r="37.56" fill="#a6caa7" />
    <circle cx="129" cy="107" r="29.09" fill="#c5d9b6" />
    <circle cx="129" cy="107" r="19.61" fill="#e4e5c5" />
  </g>
  <g fill="none" stroke="#d1e6d4">
    <use href="#simplex" stroke-width="1" />
    <path d="M129 15v138M49.33 153l119.5-69m39.84 69-119.5-69" stroke-width=".7" stroke-dasharray="2 3" opacity=".7" />
  </g>
  <circle cx="129" cy="107" r="2.4" fill="#244d45" />
  <g font-family="Georgia, serif" font-style="italic" font-size="15" fill="#f1f2df">
    <text x="142" y="17">A</text><text x="32" y="157">B</text><text x="216" y="157">C</text>
  </g>
</svg>
